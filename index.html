<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e7eef5" />
    <meta
      name="description"
      content="Lephas Company Ltd builds websites, web and mobile apps, e-commerce stores, POS systems and APIs. Start a project or hire our developers."
    />
    <meta property="og:title" content="Lephas Company Ltd | Transforming the future" />
    <meta property="og:description" content="Custom websites, apps and business systems. Start a project or hire a Lephas developer." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lephas Company Ltd" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lephas Company Ltd: websites, apps and business systems" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
    <link rel="apple-touch-icon" href="/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        var saved = localStorage.getItem('lephas.theme')
        var theme = saved === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#2f3841')
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <title>Lephas Company Ltd | Transforming the future</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
